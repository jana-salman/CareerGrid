<section class="app-window browser-window" data-window="browser" aria-hidden="true" id="browser-app" data-attempt-id="{{ attempt_id or '' }}">
    <div class="window-header">
        <div class="window-title"><span class="mini-icon app-icon-browser">◎</span><strong>CareerGrid Browser</strong></div>
        <div class="window-controls">
            <button type="button" data-window-action="minimize" title="Minimize">−</button>
            <button type="button" data-window-action="close" title="Close">×</button>
        </div>
    </div>
    <div class="browser-layout">
        <div class="browser-tab-strip" id="browser-tab-strip" role="tablist" aria-label="Browser tabs"></div>
        <div class="browser-toolbar">
            <div class="browser-navigation" aria-label="Browser navigation">
                <button type="button" data-browser-action="back" title="Back" aria-label="Back">←</button>
                <button type="button" data-browser-action="forward" title="Forward" aria-label="Forward">→</button>
                <button type="button" data-browser-action="reload" title="Reload" aria-label="Reload">↻</button>
                <button type="button" data-browser-action="home" title="Home" aria-label="Home">⌂</button>
            </div>
            <form class="browser-address-form" id="browser-address-form">
                <span class="browser-scheme-icon" aria-hidden="true">◇</span>
                <input id="browser-address" class="browser-address" aria-label="Address" autocomplete="off" spellcheck="false" value="careergrid://home">
            </form>
            <button type="button" class="browser-new-tab" data-browser-action="new-tab" title="New tab" aria-label="New tab">＋</button>
        </div>
        <div class="browser-loading" id="browser-loading" aria-hidden="true"></div>
        <div class="browser-viewport" id="browser-viewport">
            <main class="browser-page" id="browser-page" tabindex="-1"></main>
            <aside class="browser-devtools" aria-label="Developer tools">
                <div class="browser-devtools-tabs" role="tablist">
                    <button type="button" class="browser-devtools-tab is-active" data-devtools-tab="network">Network</button>
                    <button type="button" class="browser-devtools-tab" data-devtools-tab="console">Console</button>
                    <button type="button" class="browser-devtools-tab" data-devtools-tab="elements">Elements</button>
                    <button type="button" class="browser-devtools-toggle" id="browser-devtools-toggle" aria-expanded="true" title="Collapse DevTools">⌄</button>
                </div>
                <div class="browser-devtools-content" id="browser-devtools-content"></div>
            </aside>
        </div>
    </div>
</section>
