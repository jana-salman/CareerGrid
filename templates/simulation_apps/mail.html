<section
    class="app-window mail-window"
    data-window="mail"
    aria-hidden="true"
    id="mail-app"
    data-user-name="{{ user_name }}"
    data-position-id="{{ position_id }}"
    data-position-title="{{ position_title }}"
    data-company-name="{{ company_name }}"
    data-workspace-key="{{ career_id }}-{{ position_id }}-{{ company_id }}"
>

    <!-- =========================
         TITLE BAR
    ========================== -->

    <div class="window-header mail-window-header">

        <div class="window-title">

            <span class="mini-icon app-icon-mail">
                ✉
            </span>

            <strong>Mail</strong>

        </div>

        <div class="window-controls">

            <button
                type="button"
                data-window-action="minimize"
                title="Minimize"
            >
                —
            </button>

            <button
                type="button"
                data-window-action="close"
                title="Close"
            >
                ×
            </button>

        </div>

    </div>


    <!-- =========================
         OUTLOOK BODY
    ========================== -->

    <div class="mail-layout">

        <!-- FOLDERS -->

        <aside class="mail-sidebar">

            <div class="mail-sidebar-title">
                Mail
            </div>

            <nav class="mail-folders">

                <button
                    type="button"
                    class="mail-folder is-active"
                    data-mail-folder="inbox"
                >
                    <span>📥</span>

                    <span>Inbox</span>

                    <span
                        class="folder-count"
                        id="mail-inbox-count"
                    >
                        0
                    </span>
                </button>


                <button
                    type="button"
                    class="mail-folder"
                    data-mail-folder="sent"
                >
                    <span>📤</span>

                    <span>Sent</span>

                    <span
                        class="folder-count"
                        id="mail-sent-count"
                    >
                        0
                    </span>
                </button>

            </nav>


            <div class="mail-sidebar-footer">

                <span class="mail-account-avatar">
                    {{ (user_name or 'U')[0] | upper }}
                </span>

                <div>
                    <strong>
                        {{ user_name }}
                    </strong>

                    <small>
                        {{ position_title }}
                    </small>
                </div>

            </div>

        </aside>


        <!-- =========================
             MESSAGE LIST
        ========================== -->

        <section class="mail-list-column">

            <div class="mail-list-toolbar">

                <div>

                    <h2 id="mail-folder-title">
                        Inbox
                    </h2>

                    <span id="mail-folder-subtitle">
                        Your workplace messages
                    </span>

                </div>

                <input
                    type="search"
                    id="mail-search"
                    placeholder="Search mail"
                    autocomplete="off"
                >

            </div>


            <div
                class="mail-message-list"
                id="mail-message-list"
            >
            </div>

        </section>


        <!-- =========================
             READING PANE
        ========================== -->

        <section
            class="mail-reading-pane"
            id="mail-reading-pane"
        >

            <div
                class="mail-empty-state"
                id="mail-empty-state"
            >

                <div class="mail-empty-icon">
                    ✉
                </div>

                <h2>Select a message</h2>

                <p>
                    Open an email from your inbox to
                    read it here.
                </p>

            </div>


            <div
                class="mail-message-view"
                id="mail-message-view"
                hidden
            >

                <!-- HEADER -->

                <header class="mail-message-header">

                    <div>

                        <div class="mail-message-label-row">

                            <span
                                class="mail-priority"
                                id="mail-message-priority"
                            >
                            </span>

                            <span
                                class="mail-deadline"
                                id="mail-message-deadline"
                                hidden
                            >
                            </span>

                        </div>

                        <h1 id="mail-message-subject">
                        </h1>

                    </div>

                </header>


                <!-- THREAD -->

                <div
                    class="mail-thread"
                    id="mail-thread"
                >
                </div>


                <!-- ATTACHMENTS -->

                <section
                    class="mail-attachments"
                    id="mail-attachments"
                    hidden
                >

                    <h3>Attachments</h3>

                    <div
                        class="mail-attachment-list"
                        id="mail-attachment-list"
                    >
                    </div>

                </section>


                <!-- ACTIONS -->

                <div
                    class="mail-message-actions"
                    id="mail-message-actions"
                >

                    <button
                        type="button"
                        class="mail-primary-action"
                        id="mail-reply-button"
                    >
                        ↩ Reply
                    </button>

                </div>


                <!-- COMPOSER -->

                <section
                    class="mail-composer"
                    id="mail-composer"
                    hidden
                >

                    <div class="mail-composer-header">

                        <span>
                            To:
                        </span>

                        <strong id="mail-compose-recipient">
                        </strong>

                    </div>


                    <textarea
                        id="mail-reply-text"
                        rows="8"
                        placeholder="Write your reply..."
                    ></textarea>


                    <div class="mail-composer-footer">

                        <span class="mail-draft-status">
                            Your reply will stay in this email thread.
                        </span>

                        <div class="mail-compose-actions">

                            <button
                                type="button"
                                class="mail-cancel-button"
                                id="mail-cancel-reply"
                            >
                                Cancel
                            </button>

                            <button
                                type="button"
                                class="mail-send-button"
                                id="mail-send-button"
                            >
                                Send
                            </button>

                        </div>

                    </div>

                </section>

            </div>

        </section>

    </div>


    <!-- =========================
         TOAST
    ========================== -->

    <div
        class="mail-toast"
        id="mail-toast"
        hidden
    >
    </div>

</section>
