<section
    class="app-window github-app-window"
    data-window="github"
    aria-hidden="true"
    id="github-app"
    data-user-name="{{ user_name }}"
    data-position-id="{{ position_id }}"
>
    <div class="window-header github-app-header">
        <div class="window-title">
            <span class="mini-icon app-icon-github">GH</span>
            <strong>GitHub</strong>
        </div>

        <div class="window-controls">
            <button type="button" data-window-action="minimize" title="Minimize">—</button>
            <button type="button" data-window-action="close" title="Close">×</button>
        </div>
    </div>

    <div class="github-toolbar">
        <label class="github-repository-picker">
            <span>Repository</span>
            <select id="github-repository-select" aria-label="Repository"></select>
        </label>
    </div>

    <div class="github-content" id="github-content">
        <div class="github-empty-state">
            <strong>No repositories available.</strong>
            <span>Download and extract a project first.</span>
        </div>
    </div>

    <div class="github-toast" id="github-toast" hidden></div>
</section>
