<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Choose Career | CareerGrid</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/careergrid-theme.css') }}">
</head>
<body>

    <div class="career-page">
        <nav class="navbar">
    <h2 class="logo">CareerGrid</h2>

    <div>
        <a href="{{ url_for('careers.home') }}">Home</a>
        <a href="{{ url_for('dashboard.dashboard') }}">Dashboard</a>
    </div>
</nav>

        <div class="career-header">
            <h1>Choose a Career Path</h1>
            <p>Select a career you want to explore through an interactive simulation.</p>
        </div>

        <div class="career-grid">
            {% for career in careers %}
            <div class="career-card{% if not career.available %} career-card--unavailable{% endif %}">
                <div class="career-icon">{{ career.icon }}</div>
                <h3>{{ career.title }}</h3>
                <p>{{ career.description }}</p>
                {% if career.available %}
                <a href="{{ url_for('careers.positions', career_id=career.id) }}">
                    View Positions
                </a>
                {% else %}
                <button
                    class="coming-soon-control"
                    type="button"
                    disabled
                >Coming Soon</button>
                {% endif %}
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
