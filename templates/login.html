<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | CareerGrid</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="auth-page">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p>Login to continue your CareerGrid journey.</p>

            <form action="{{ url_for('auth.login') }}" method="POST">
                <input
                    type="email"
                    name="email"
                    placeholder="Email address"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >
                {% if message %}
                    <p class="success-message">{{ message }}</p>
                {% endif %}
                {% if error %}
                    <p class="error-message">{{ error }}</p>
                {% endif %}

                <button type="submit">Login</button>
            </form>

            <p class="auth-link">
                Don't have an account?
                <a href="/register">Sign up</a>
            </p>
        </div>
    </div>

</body>
</html>
